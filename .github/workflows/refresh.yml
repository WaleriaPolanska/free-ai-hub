name: Refresh data

on:
  schedule:
    - cron: "0 6 */3 * *"   # every 3 days at 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check links and refresh GitHub stars
        run: python scripts/check_links.py data.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Keep Supabase votes database awake
        run: curl -fsS -X POST "https://ghztrdkufbgggbzwwtlf.supabase.co/rest/v1/rpc/vote_counts" -H "apikey: sb_publishable_yzOV4c3b4f7f2PxkN2n9kg_v6b_qAae" -H "Content-Type: application/json" -d '{}' > /dev/null
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet || (git commit -m "Refresh data $(date -u +%F)" && git push)
